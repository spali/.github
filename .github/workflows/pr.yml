# Reusable: label and check pull requests, clean up dev builds of closed ones.
#
# Call it from a workflow triggered by pull_request_target with the types
# opened, reopened, edited, synchronize, labeled, unlabeled, closed.
# pull_request_target is required so that pull requests from forks can be
# labeled; this workflow never checks out or runs code from the pull request.
name: Pull request

on:
  workflow_call:

permissions:
  contents: read

jobs:
  label:
    name: label
    if: contains(fromJSON('["opened", "reopened", "edited"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # add labels
    steps:
      - name: Label from the title
        uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: spali/.github:release-drafter.yml@${{ job.workflow_sha || 'job-workflow-sha-unavailable' }}

  check:
    name: check
    needs: label
    # also runs when label was skipped (synchronize, labeled, unlabeled);
    # never skipped otherwise, a skipped required check counts as passed
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the label job
        env:
          LABEL_RESULT: ${{ needs.label.result }}
        run: |
          if [[ $LABEL_RESULT == failure || $LABEL_RESULT == cancelled ]]; then
            echo "error: labeling the pull request failed, re-run the jobs"; exit 1
          fi
      - name: Checkout shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spali/.github
          ref: ${{ job.workflow_sha || 'job-workflow-sha-unavailable' }}
          path: .release-flow
          persist-credentials: false
      - name: Check title and labels
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .release-flow/scripts/check-pr.sh

  cleanup:
    name: cleanup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # delete dev pre-releases and their tags
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spali/.github
          ref: ${{ job.workflow_sha || 'job-workflow-sha-unavailable' }}
          path: .release-flow
          persist-credentials: false
      - name: Delete dev builds of this pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .release-flow/scripts/cleanup-pr.sh
