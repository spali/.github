# Reusable: publish the files of the build job (last job of a repository's
# release.yml). Pass the outputs of release-prepare.yml through unchanged.
#
# The build job uploads its files as the artifact "release-assets". This
# workflow adds checksums.txt, attests the build provenance over it and
# publishes the release, the "-next" or the dev pre-release.
name: Release publish

on:
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true
      pr:
        type: string
        required: false
        default: ""
      draft-id:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create, edit and delete releases and tags
      pull-requests: write # comment the dev build link
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # create the artifact storage record
    steps:
      - name: Check the release kind
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case $KIND in
          release | next | pr) ;;
          *) echo "error: unknown release kind '$KIND'"; exit 1 ;;
          esac
      - name: Checkout shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spali/.github
          ref: ${{ job.workflow_sha }}
          path: .release-flow
          persist-credentials: false
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Write checksums.txt
        run: .release-flow/scripts/checksums.sh dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish
        env:
          KIND: ${{ inputs.kind }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          PR: ${{ inputs.pr }}
          DRAFT_ID: ${{ inputs.draft-id }}
          ASSETS_DIR: dist
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .release-flow/scripts/publish.sh "$KIND"
