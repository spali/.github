# Reusable: delete the container images of closed pull requests and of
# superseded main builds.
#
# Deletes the ghcr.io image tags matching *-pr.* and *-next, except those of
# a release that still exists (the release flow deletes the pre-release of a
# closed pull request and the older next releases), plus untagged and
# orphaned images. Release images (X.Y.Z, X.Y, X, latest) are never deleted.
#
# Call it as a job after the release flow in release.yml and after the pr job
# in pr.yml (input package: the package name, default the repository name):
#
#   # release.yml
#     image-cleanup:
#       needs: publish
#       permissions:
#         contents: read
#         packages: write # delete image versions
#       uses: spali/.github/.github/workflows/image-cleanup.yml@<sha> # vX.Y.Z
#
#   # pr.yml
#     image-cleanup:
#       needs: pr
#       if: github.event.action == 'closed'
#       permissions:
#         contents: read
#         packages: write # delete image versions
#       uses: spali/.github/.github/workflows/image-cleanup.yml@<sha> # vX.Y.Z
#
# The repository needs Admin access on the package (package settings, Manage
# Actions access) to delete versions.
name: Image cleanup

on:
  workflow_call:
    inputs:
      package:
        description: Name of the container package, defaults to the repository name
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  cleanup:
    name: cleanup
    concurrency:
      group: image-cleanup-${{ github.repository }}-${{ inputs.package || github.event.repository.name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # delete image versions
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spali/.github
          ref: ${{ job.workflow_sha || 'job-workflow-sha-unavailable' }}
          path: .release-flow
          persist-credentials: false
      - name: Tags to keep
        id: keep
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .release-flow/scripts/image-cleanup.sh
      - name: Delete dev and next images
        id: cleanup
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          owner: ${{ github.repository_owner }}
          package: ${{ inputs.package || github.event.repository.name }}
          delete-tags: "*-pr.*,*-next"
          exclude-tags: ${{ steps.keep.outputs.tags }}
          delete-untagged: true
          delete-orphaned-images: true
          # A build pushes its image before publish creates the release, so a
          # concurrent cleanup must not delete it. The action skips versions
          # updated more recently, from all rules. 2 hours is above the 45
          # minute build timeout plus the wait for publish.
          older-than: 2 hours
