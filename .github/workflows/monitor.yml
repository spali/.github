# Reusable: the daily maintenance monitor of all repositories of the owner.
#
# Call it from a workflow of a PRIVATE control repository (the logs, the job
# summary and the overview issue list private repositories by name):
#
#   on:
#     schedule:
#       - cron: "17 5 * * *"
#     workflow_dispatch:
#   concurrency:
#     group: monitor
#   permissions:
#     contents: read
#     issues: write # the overview issue of that repository and its monitor comment
#   jobs:
#     monitor:
#       uses: spali/.github/.github/workflows/monitor.yml@<sha> # vX.Y.Z
#       with:
#         app-client-id: ${{ vars.MONITOR_APP_CLIENT_ID }}
#       secrets:
#         app-key: ${{ secrets.MONITOR_APP_KEY }}
#
# The control file (default repos.yml) is read from the calling repository.
# The monitor only reads from GitHub, with a read-only app token; the single
# thing it writes is the overview issue (with its monitor comment and its
# label) in the calling repository, with that repository's GITHUB_TOKEN. The run fails while a red
# finding is open. The caller owns the schedule and the concurrency group.
#
# Jobs: Inventory (control file, inventory, the jobs per check group) → one
# matrix job per check group (release, settings, health, forks,
# managed) and Lists → Report (collects the findings of all jobs as artifacts,
# kept 1 day; job summary and overview issue). The control file chooses one job per group
# (monitor.jobs: per-group, default) or one per group and repository
# (per-repo), and the runner of all jobs but Inventory (monitor.runs-on).
name: Monitor

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client id of the read-only GitHub App
        type: string
        required: true
      config:
        description: Path of the control file in the calling repository
        type: string
        default: repos.yml
    secrets:
      app-key:
        description: Private key of the read-only GitHub App
        required: true

permissions:
  contents: read

env:
  MONITOR_CONFIG: ${{ inputs.config }}
  MONITOR_WORK: .monitor-work

jobs:
  prepare:
    name: Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.matrix.outputs.ready }}
      runner: ${{ steps.matrix.outputs.runner }}
      release: ${{ steps.matrix.outputs.release }}
      settings: ${{ steps.matrix.outputs.settings }}
      health: ${{ steps.matrix.outputs.health }}
      forks: ${{ steps.matrix.outputs.forks }}
      managed: ${{ steps.matrix.outputs.managed }}
    steps:
      - &app-token
        name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          owner: spali
          permission-metadata: read
          permission-contents: read
          permission-actions: read
          permission-administration: read
          permission-pull-requests: read
          permission-vulnerability-alerts: read
          permission-security-events: read
      - name: Checkout control file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &scripts
        name: Checkout shared scripts
        id: scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spali/.github
          ref: ${{ job.workflow_sha || 'job-workflow-sha-unavailable' }}
          path: .monitor
          persist-credentials: false
      - name: Control file
        run: .monitor/scripts/monitor.sh config
      - name: Inventory
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .monitor/scripts/monitor.sh inventory
      - name: Repositories per check group
        id: matrix
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' }}
        run: |
          groups=$(.monitor/scripts/monitor.sh matrix)
          for g in release settings health forks managed; do
            echo "$g=$(jq -c --arg g "$g" '.[$g]' <<<"$groups")" >>"$GITHUB_OUTPUT"
            echo "$g: $(jq -r --arg g "$g" '.[$g] | length' <<<"$groups") repositories"
          done
          echo "runner=$(jq -c '."runs-on"' <<<"$groups")" >>"$GITHUB_OUTPUT"
          echo "runs-on: $(jq -c '."runs-on"' <<<"$groups")"
          echo "ready=true" >>"$GITHUB_OUTPUT"
      - name: Upload inventory
        if: ${{ !cancelled() && steps.matrix.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitor-base
          path: |
            .monitor-work/config.json
            .monitor-work/inventory.json
          retention-days: 1
          include-hidden-files: true
      - &upload-findings
        name: Upload findings
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: .monitor-work/findings.jsonl
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Release flow · ${{ matrix.repo || 'all repositories' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.release != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.release) }}
    steps: &group-steps
      - *app-token
      - *scripts
      - name: Download inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitor-base
          path: .monitor-work
      - name: Check ${{ matrix.repo || 'all repositories' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MONITOR_REPO: ${{ matrix.repo }}
        run: .monitor/scripts/monitor.sh "$GITHUB_JOB"
      - *upload-findings

  settings:
    name: Settings · ${{ matrix.repo || 'all repositories' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.settings != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.settings) }}
    steps: *group-steps

  health:
    name: Health · ${{ matrix.repo || 'all repositories' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.health != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.health) }}
    steps: *group-steps

  forks:
    name: Forks · ${{ matrix.repo || 'all repositories' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.forks != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.forks) }}
    steps: *group-steps

  managed:
    name: Managed · ${{ matrix.repo || 'all repositories' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.managed != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.managed) }}
    steps: *group-steps

  lists:
    name: Lists
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - *app-token
      - *scripts
      - name: Download inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitor-base
          path: .monitor-work
      - name: Check lists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .monitor/scripts/monitor.sh lists
      - *upload-findings

  report:
    name: Report
    needs: [prepare, release, settings, health, forks, managed, lists]
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the overview issue and its monitor comment in the calling repository
    steps:
      - *scripts
      - name: Download inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monitor-base
          path: .monitor-work
      - name: Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          path: .monitor-findings
      - name: Collect findings
        run: cat .monitor-findings/*/findings.jsonl >.monitor-work/findings.jsonl
      - name: Report
        env:
          MONITOR_DOCS_URL: ${{ github.server_url }}/spali/.github/blob/${{ job.workflow_sha }}/docs/monitor-checks.md
          MONITOR_CONFIG_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.config }}
        run: .monitor/scripts/monitor.sh report
      - name: Overview issue
        env:
          ISSUE_TOKEN: ${{ github.token }}
          MONITOR_ISSUE_REPO: ${{ github.repository }}
        run: .monitor/scripts/monitor.sh issue
