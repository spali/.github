name: Monitor

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MONITOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MONITOR_APP_KEY }}
          owner: spali
          permission-metadata: read
          permission-contents: read
          permission-actions: read
          permission-administration: read
          permission-pull-requests: read
          permission-vulnerability-alerts: read
          permission-security-events: read
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout private control file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.MONITOR_PRIVATE_REPO }}
          path: private
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Run monitor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LISTS_TOKEN: ${{ steps.app-token.outputs.token }}
          MONITOR_PRIVATE_CONFIG: private/repos.yml
        run: scripts/monitor.sh
